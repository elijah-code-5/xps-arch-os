---
defaultGroups:
    - users
    - lp
    - video
    - network
    - storage
    - wheel
    - audio
    - uucp
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: false
userShell: /bin/bash
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    minLength: -1
    maxLength: -1
hostname:
    location: EtcFile
    writeHostsFile: true
