---
# Remove live-USB leftovers from the freshly copied system and restore normal boot files.
dontChroot: false
timeout: 120
script:
    - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "cp /usr/share/xps-arch-os/linux.preset /etc/mkinitcpio.d/linux.preset"
    - "rm -rf /etc/systemd/system/getty@tty1.service.d"
    - "rm -f /etc/systemd/system/multi-user.target.wants/live-user.service /etc/systemd/system/live-user.service /usr/local/bin/create-live-user"
    - "rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service /etc/systemd/system/multi-user.target.wants/choose-mirror.service"
    - "rm -f /etc/systemd/system/pacman-init.service /etc/systemd/system/choose-mirror.service /usr/local/bin/choose-mirror"
    - "rm -f /root/.automated_script.sh /etc/motd"
    - "pacman-key --init"
    - "pacman-key --populate archlinux"
