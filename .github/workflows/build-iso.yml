name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm archiso git curl sudo base-devel

      - uses: actions/checkout@v4

      - name: Add the chaotic-aur repo to the build machine
        run: |
          pacman-key --init
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'

      - name: List what chaotic-aur offers for our packages
        run: |
          pacman -Sy
          pacman -Sl chaotic-aur | grep -iE ' (calamares|ckbcomp|arduino)' || echo "none found"

      - name: Prepare the ISO profile
        run: |
          cp -r /usr/share/archiso/configs/releng profile
          bash scripts/apply-overlay.sh profile

      - name: Build the ISO
        run: mkarchiso -v -w /tmp/work -o out profile

      - name: Check the installer config made it in
        run: |
          if [ ! -f /tmp/work/x86_64/airootfs/etc/calamares/modules/partition.conf ]; then
            echo "::warning::Calamares default module configs are missing; the installer will need fixing."
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: xps-arch-os-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
