name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space (the full image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo mkdir -p /mnt/work && sudo chmod 777 /mnt/work
          df -h / /mnt

      - name: Build inside Arch Linux
        run: |
          mkdir -p out release
          docker run --rm --privileged \
            -v "$PWD":/repo -v /mnt/work:/work \
            archlinux:latest bash /repo/scripts/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xps-arch-os-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish as a release (public link, resumable download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: XPS Arch OS ISO ${{ github.run_number }}
          files: release/*
