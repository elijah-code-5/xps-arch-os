name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm archiso git python sudo

      - uses: actions/checkout@v4

      - name: Prepare the ISO profile
        run: |
          cp -r /usr/share/archiso/configs/releng profile
          bash scripts/apply-overlay.sh profile

      - name: Check every installed-system package exists
        run: |
          pacman -Sy
          missing=0
          for p in $(grep -vE '^\s*(#|$)' overlay/packages.installed); do
            pacman -Si "$p" >/dev/null 2>&1 || { echo "::error::missing package: $p"; missing=1; }
          done
          exit $missing

      - name: Build the ISO
        run: mkarchiso -v -w /tmp/work -o out profile

      - name: Show the result
        run: ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: xps-arch-os-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14

      - name: Publish as a release (public link, resumable download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: XPS Arch OS ISO ${{ github.run_number }}
          files: out/*.iso
